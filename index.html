<style>
  :root{
    --bg: #F3F1E7;
    --surface: #FFFFFF;
    --ink: #2B2A25;
    --ink-soft: #857F6D;
    --teal: #2F6B65;
    --teal-soft: #E4EDEC;
    --gold: #C9972E;
    --gold-soft: #F6EBD3;
    --clay: #B25D45;
    --clay-soft: #F5E6E0;
    --good: #4C7A52;
    --good-soft: #E7EFE4;
    --line: #E3DFD0;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html[lang="he"] body{ font-family:'Heebo', system-ui, sans-serif; }
  html[lang="he"] h1,html[lang="he"] h2,html[lang="he"] h3{ font-family:'Heebo', sans-serif; font-weight:600; }
  h1,h2,h3{font-family:'Fraunces', serif; font-weight:600; margin:0;}
  button{font-family:inherit;}
  .app-shell{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--bg);}

  /* ---------- Auth screen ---------- */
  #authScreen{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 28px; text-align:center; gap:10px;
  }
  #authScreen .mark{
    width:56px; height:56px; border-radius:16px; background:var(--teal);
    display:flex; align-items:center; justify-content:center; margin-bottom:18px;
    font-family:'Fraunces',serif; color:#fff; font-size:26px;
  }
  #authScreen h1{font-size:28px; line-height:1.2;}
  #authScreen p{color:var(--ink-soft); font-size:15px; max-width:280px; margin:6px 0 26px;}
  .lang-switch{
    display:flex; gap:6px; margin-bottom:22px; background:var(--surface); border:1px solid var(--line);
    border-radius:999px; padding:3px;
  }
  .lang-switch button{
    border:none; background:transparent; padding:6px 14px; border-radius:999px; font-size:13px;
    color:var(--ink-soft); cursor:pointer;
  }
  .lang-switch button.active{background:var(--teal); color:#fff;}
  .google-btn{
    display:flex; align-items:center; gap:10px; background:#fff; color:#3c3c3c;
    border:1px solid var(--line); border-radius:999px; padding:13px 22px;
    font-size:15px; font-weight:500; cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.05);
  }
  .google-btn:active{transform:scale(.98);}
  #authError{color:var(--clay); font-size:13px; margin-top:14px; min-height:16px;}

  /* ---------- App header ---------- */
  header.top{
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(16px + env(safe-area-inset-top,0px)) 20px 14px;
    padding-top:16px; gap:10px;
  }
  header.top .title h2{font-size:20px;}
  header.top .title span{font-size:12px; color:var(--ink-soft);}
  header.top .right{display:flex; align-items:center; gap:8px;}
  .lang-pill{
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); font-size:12px;
    border-radius:999px; padding:7px 11px; cursor:pointer;
  }
  .avatar-btn{
    width:36px; height:36px; border-radius:50%; border:none; overflow:hidden; cursor:pointer;
    background:var(--teal); color:#fff; font-size:14px; font-weight:600; display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .avatar-btn img{width:100%; height:100%; object-fit:cover;}

  #signOutSheet{
    position:fixed; inset:0; background:rgba(0,0,0,.25); display:none; align-items:flex-end; z-index:50;
  }
  #signOutSheet.show{display:flex;}
  #signOutSheet .sheet{
    background:var(--surface); width:100%; max-width:480px; margin:0 auto; border-radius:18px 18px 0 0;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));
  }
  #signOutSheet .sheet p{margin:0 0 14px; color:var(--ink-soft); font-size:13px;}
  #signOutSheet button.action{
    width:100%; padding:13px; border-radius:12px; border:none; background:var(--clay-soft); color:var(--clay);
    font-size:15px; font-weight:500; cursor:pointer; margin-bottom:8px;
  }
  #signOutSheet button.cancel{
    width:100%; padding:13px; border-radius:12px; border:1px solid var(--line); background:transparent; color:var(--ink);
    font-size:15px; cursor:pointer;
  }

  /* ---------- Main / views ---------- */
  main{flex:1; padding:4px 20px 100px; overflow-y:auto;}
  .view{display:none;}
  .view.active{display:block;}

  .toolbar-row{display:flex; gap:8px; margin-bottom:6px;}
  .toolbar-row .add-toggle{margin-bottom:0; flex:1;}
  .export-btn{
    display:flex; align-items:center; gap:6px; padding:12px 14px; border-radius:12px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); font-size:13px;
    cursor:pointer; white-space:nowrap;
  }

  .add-toggle{
    width:100%; display:flex; align-items:center; gap:8px; padding:12px 14px; border-radius:12px;
    border:1.5px dashed var(--line); background:transparent; color:var(--ink-soft); font-size:14px;
    cursor:pointer; margin-bottom:6px;
  }
  .add-toggle span.plus{font-size:16px; color:var(--teal);}

  .composer{
    background:var(--surface); border-radius:var(--radius); padding:14px; margin-bottom:14px;
    border:1px solid var(--line); display:none;
  }
  .composer.show{display:block;}
  .composer textarea{
    width:100%; border:none; resize:vertical; min-height:80px; font-family:inherit; font-size:15px;
    outline:none; background:transparent; color:var(--ink); line-height:1.45;
  }
  .composer input[type=date]{
    border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-family:inherit; font-size:13px;
    color:var(--ink-soft); margin-bottom:10px; background:transparent;
  }
  .composer .row{display:flex; align-items:center; flex-wrap:wrap; justify-content:flex-end; gap:8px; margin-top:8px;}
  .btn{
    border:none; border-radius:10px; padding:9px 16px; font-size:14px; font-weight:500; cursor:pointer;
  }
  .btn.primary{background:var(--teal); color:#fff;}
  .btn.ghost{background:transparent; color:var(--ink-soft);}
  .btn.recording{background:var(--clay-soft); color:var(--clay);}

  .photo-preview{position:relative; margin:8px 0; display:none;}
  .photo-preview.show{display:block;}
  .photo-preview img{width:100%; border-radius:10px; max-height:220px; object-fit:cover; display:block;}
  .photo-preview .remove-photo{
    position:absolute; top:8px; inset-inline-end:8px; background:rgba(20,18,14,.6); color:#fff; border:none;
    border-radius:50%; width:26px; height:26px; cursor:pointer; font-size:15px; line-height:1;
  }
  .audio-preview{display:none; align-items:center; gap:8px; margin:8px 0;}
  .audio-preview.show{display:flex;}
  .audio-preview audio{flex:1; height:36px;}
  .audio-preview button{background:none; border:none; color:var(--clay); cursor:pointer; font-size:16px;}
  .draft-note{font-size:11.5px; color:var(--ink-soft); margin-top:4px; display:none;}
  .draft-note.show{display:block;}

  .card{
    background:var(--surface); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
    border:1px solid var(--line);
  }
  .card-photo{width:100%; border-radius:10px; max-height:260px; object-fit:cover; display:block; margin-bottom:10px; cursor:pointer;}
  .card audio{width:100%; margin-bottom:10px; height:36px;}
  .card .meta{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .mini-avatar{width:24px; height:24px; border-radius:50%; background:var(--teal); color:#fff; font-size:11px; font-weight:600; display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0;}
  .mini-avatar img{width:100%; height:100%; object-fit:cover;}
  .meta .name{font-size:13.5px; font-weight:500;}
  .meta .dot{color:var(--line);}
  .meta .time{font-size:12.5px; color:var(--ink-soft);}
  .badge{
    font-size:11px; padding:2px 8px; border-radius:999px; font-weight:500; margin-inline-start:auto;
  }
  .badge.day{background:var(--teal-soft); color:var(--teal);}
  .badge.note{background:var(--gold-soft); color:var(--gold);}
  .card .content{font-size:14.5px; line-height:1.55; white-space:pre-wrap;}
  .card .content textarea{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 10px; font-family:inherit;
    font-size:14.5px; min-height:70px; resize:vertical; outline:none;
  }
  .edit-row{display:flex; justify-content:flex-end; gap:8px; margin-top:8px;}

  .card-actions{display:flex; align-items:center; gap:4px; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); flex-wrap:wrap;}
  .reaction-btn{
    background:none; border:1px solid transparent; font-size:13px; cursor:pointer; padding:4px 8px;
    border-radius:20px; color:var(--ink-soft); display:flex; align-items:center; gap:4px;
  }
  .reaction-btn.active{background:var(--teal-soft); color:var(--teal); border-color:transparent;}
  .spacer{flex:1;}
  .icon-btn{background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:13px; padding:4px 6px;}
  .comment-toggle{background:none; border:none; color:var(--ink-soft); font-size:12.5px; cursor:pointer; padding:4px 6px;}

  .comments-box{margin-top:10px; padding-top:10px; border-top:1px solid var(--line); display:none;}
  .comments-box.show{display:block;}
  .comment-row{font-size:13px; margin-bottom:7px; line-height:1.4;}
  .comment-row b{font-weight:600;}
  .comment-input-row{display:flex; gap:6px; margin-top:4px;}
  .comment-input-row input{
    flex:1; border:1px solid var(--line); border-radius:20px; padding:8px 13px; font-size:13px;
    font-family:inherit; outline:none; background:var(--bg);
  }
  .comment-input-row button{border:none; background:var(--teal); color:#fff; border-radius:20px; padding:8px 14px; font-size:12.5px; cursor:pointer;}

  .empty{
    text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:14px; line-height:1.6;
  }

  /* Chairs list */
  .chair-row{
    background:var(--surface); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
    border:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; cursor:pointer;
    gap:10px;
  }
  .chair-row h3{font-size:15.5px; font-weight:500; font-family:inherit;}
  .chair-row .sub{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}
  .status-pill{font-size:11.5px; padding:4px 10px; border-radius:999px; font-weight:500; white-space:nowrap;}
  .status-pill.ok{background:var(--good-soft); color:var(--good);}
  .status-pill.warn{background:var(--clay-soft); color:var(--clay);}
  .status-pill.pending{background:var(--line); color:var(--ink-soft);}

  /* Chair detail */
  #chairDetailView{padding-bottom:40px;}
  .back-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:4px 0 14px; color:var(--ink-soft); font-size:14px;}
  .back-row .back-link{cursor:pointer;}
  .back-row .delete-chair{color:var(--clay); cursor:pointer; font-size:13px; background:none; border:none;}
  .chair-title input{
    width:100%; border:none; background:transparent; font-family:inherit; font-size:24px;
    font-weight:600; color:var(--ink); outline:none; padding:2px 0; margin-bottom:12px;
  }
  .chair-photo-row{margin-bottom:16px;}
  .chair-photo-row img{width:100%; border-radius:12px; max-height:220px; object-fit:cover; display:block; margin-bottom:8px;}
  .checklist-item{
    background:var(--surface); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px; border:1px solid var(--line);
  }
  .checklist-item .label-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:2px;}
  .checklist-item .label{font-size:15px; font-weight:500;}
  .status-toggle{display:flex; gap:6px; margin-top:8px;}
  .status-toggle button{
    flex:1; padding:8px 0; border-radius:9px; border:1px solid var(--line); background:transparent;
    font-size:13px; color:var(--ink-soft); cursor:pointer;
  }
  .status-toggle button.good.active{background:var(--good-soft); color:var(--good); border-color:transparent;}
  .status-toggle button.problem.active{background:var(--clay-soft); color:var(--clay); border-color:transparent;}
  .problem-note{
    margin-top:10px; width:100%; border:1px solid var(--line); border-radius:9px; padding:9px 10px;
    font-family:inherit; font-size:13.5px; min-height:56px; resize:vertical; outline:none; display:none;
  }
  .problem-note.show{display:block;}
  .item-photo-row{margin-top:8px; display:flex; align-items:center; gap:8px;}
  .item-photo-btn{
    background:none; border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:12px;
    color:var(--ink-soft); cursor:pointer;
  }
  .item-photo-thumb{width:44px; height:44px; border-radius:8px; object-fit:cover; cursor:pointer;}
  .add-item-btn{
    width:100%; text-align:center; padding:11px; border-radius:12px; border:1.5px dashed var(--line);
    background:transparent; color:var(--ink-soft); font-size:13.5px; cursor:pointer; margin-top:4px;
  }

  /* ---------- Bottom nav ---------- */
  nav.bottom{
    position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--line);
    padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));
    display:flex; justify-content:space-around; max-width:480px; margin:0 auto;
  }
  nav.bottom button{
    background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--ink-soft); font-size:11px; padding:4px 10px; cursor:pointer;
  }
  nav.bottom button svg{width:21px; height:21px;}
  nav.bottom button.active{color:var(--teal);}

  .toast{
    position:fixed; bottom:78px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:9px 16px; border-radius:999px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s;
    z-index:60; max-width:85%; text-align:center;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div class="app-shell">

  <!-- AUTH -->
  <div id="authScreen">
    <div class="lang-switch">
      <button data-lang-btn="en">EN</button>
      <button data-lang-btn="he">עברית</button>
    </div>
    <div class="mark">G</div>
    <h1 data-i18n="appTitle">Ghana Trip</h1>
    <p data-i18n="tagline">A shared space for day summaries, notes, and chair inspections — for everyone on the team, home and away.</p>
    <button class="google-btn" id="googleSignIn">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.9v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.9A9 9 0 0 0 0 9c0 1.45.35 2.82.9 4.03l3.05-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .9 4.97l3.05 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      <span data-i18n="signInGoogle">Sign in with Google</span>
    </button>
    <div id="authError"></div>
  </div>

  <!-- APP -->
  <div id="app" style="display:none; flex:1; display:none; flex-direction:column;">
    <header class="top">
      <div class="title">
        <h2 data-i18n="appTitle">Ghana Trip</h2>
        <span id="dayCount"></span>
      </div>
      <div class="right">
        <button class="lang-pill" id="langToggleBtn">עברית</button>
        <button class="avatar-btn" id="avatarBtn"></button>
      </div>
    </header>

    <main>
      <!-- FEED -->
      <div class="view" id="feedView">
        <div id="feedList"></div>
      </div>

      <!-- DAY SUMMARIES -->
      <div class="view" id="daysView">
        <div class="toolbar-row">
          <button class="add-toggle" data-composer="dayComposer"><span class="plus">+</span> <span data-i18n="addDay">Add a day summary</span></button>
          <button class="export-btn" id="exportDaysBtn">⭳ <span data-i18n="export">Export</span></button>
        </div>
        <div class="composer" id="dayComposer">
          <input type="date" id="dayDate">
          <textarea id="dayText" data-i18n-placeholder="dayPlaceholder" placeholder="What happened today?"></textarea>
          <div class="draft-note" id="dayDraftNote" data-i18n="draftRestored">Draft restored from your last visit</div>
          <div class="photo-preview" id="dayPhotoPreview"><img id="dayPhotoImg"><button class="remove-photo" id="dayPhotoRemove">×</button></div>
          <div class="audio-preview" id="dayAudioPreview"><audio id="dayAudioPlayer" controls></audio><button id="dayAudioRemove">✕</button></div>
          <input type="file" id="dayPhotoInput" accept="image/*" style="display:none">
          <div class="row">
            <button class="btn ghost" id="dayPhotoBtn">📷 <span data-i18n="photo">Photo</span></button>
            <button class="btn ghost" id="dayRecordBtn">🎤 <span data-i18n="record">Record</span></button>
            <div class="spacer"></div>
            <button class="btn ghost" data-close="dayComposer" data-i18n="cancel">Cancel</button>
            <button class="btn primary" id="saveDayBtn" data-i18n="save">Save</button>
          </div>
        </div>
        <div id="daysList"></div>
      </div>

      <!-- NOTES -->
      <div class="view" id="notesView">
        <button class="add-toggle" data-composer="noteComposer"><span class="plus">+</span> <span data-i18n="addNote">Add a thought or note</span></button>
        <div class="composer" id="noteComposer">
          <textarea id="noteText" data-i18n-placeholder="notePlaceholder" placeholder="Something worth remembering..."></textarea>
          <div class="draft-note" id="noteDraftNote" data-i18n="draftRestored">Draft restored from your last visit</div>
          <div class="photo-preview" id="notePhotoPreview"><img id="notePhotoImg"><button class="remove-photo" id="notePhotoRemove">×</button></div>
          <div class="audio-preview" id="noteAudioPreview"><audio id="noteAudioPlayer" controls></audio><button id="noteAudioRemove">✕</button></div>
          <input type="file" id="notePhotoInput" accept="image/*" style="display:none">
          <div class="row">
            <button class="btn ghost" id="notePhotoBtn">📷 <span data-i18n="photo">Photo</span></button>
            <button class="btn ghost" id="noteRecordBtn">🎤 <span data-i18n="record">Record</span></button>
            <div class="spacer"></div>
            <button class="btn ghost" data-close="noteComposer" data-i18n="cancel">Cancel</button>
            <button class="btn primary" id="saveNoteBtn" data-i18n="save">Save</button>
          </div>
        </div>
        <div id="notesList"></div>
      </div>

      <!-- CHAIRS LIST -->
      <div class="view" id="chairsView">
        <div class="toolbar-row">
          <button class="add-toggle" id="newChairBtn"><span class="plus">+</span> <span data-i18n="examineChair">Examine a new chair</span></button>
          <button class="export-btn" id="exportChairsBtn">⭳ <span data-i18n="export">Export</span></button>
        </div>
        <div id="chairsList"></div>
      </div>

      <!-- CHAIR DETAIL -->
      <div class="view" id="chairDetailView">
        <div class="back-row">
          <span class="back-link" id="backToChairs" data-i18n="allChairsBack">← All chairs</span>
          <button class="delete-chair" id="deleteChairBtn" data-i18n="deleteChair">Delete chair</button>
        </div>
        <div class="chair-title"><input id="chairNameInput" data-i18n-placeholder="chairNamePlaceholder" placeholder="Chair name"></div>
        <div class="chair-photo-row">
          <div class="photo-preview" id="chairPhotoPreview"><img id="chairPhotoImg"><button class="remove-photo" id="chairPhotoRemove">×</button></div>
          <input type="file" id="chairPhotoInput" accept="image/*" style="display:none">
          <button class="btn ghost" id="chairPhotoBtn" style="border:1px solid var(--line);">📷 <span data-i18n="addChairPhoto">Add a photo of this chair</span></button>

function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2000);
}
function initials(name){ return (name||'?').trim().split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function relTime(iso){
  const d = new Date(iso), diff = (Date.now()-d.getTime())/1000;
  if(diff<60) return t('justNow');
  if(diff<3600) return Math.floor(diff/60)+t('minAgo');
  if(diff<86400) return Math.floor(diff/3600)+t('hourAgo');
  if(diff<172800) return t('yesterday');
  return d.toLocaleDateString(LANG==='he'?'he-IL':undefined,{month:'short', day:'numeric'});
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function photoUrl(path){ return path ? sb.storage.from('trip-photos').getPublicUrl(path).data.publicUrl : null; }
function groupBy(arr, key){ return (arr||[]).reduce((acc,x)=>{ (acc[x[key]] = acc[x[key]]||[]).push(x); return acc; }, {}); }

async function uploadPhoto(file, folder){
  if(!file) return null;
  if(file.size > MAX_PHOTO_BYTES){ showToast(t('toastPhotoTooLarge')); return undefined; }
  const ext = (file.name.split('.').pop()||'jpg').toLowerCase();
  const path = `${folder}/${crypto.randomUUID()}.${ext}`;
  const { error } = await sb.storage.from('trip-photos').upload(path, file);
  if(error){ showToast(t('toastPhotoFailed')+error.message); return undefined; }
  return path;
}
async function uploadAudio(blob, folder){
  if(!blob) return null;
  const ext = (blob.type||'').includes('mp4') ? 'm4a' : 'webm';
  const path = `${folder}/${crypto.randomUUID()}.${ext}`;
  const { error } = await sb.storage.from('trip-photos').upload(path, blob, { contentType: blob.type || 'audio/webm' });
  if(error){ showToast(t('toastPhotoFailed')+error.message); return undefined; }
  return path;
}
async function deletePhoto(path){
  if(!path) return;
  await sb.storage.from('trip-photos').remove([path]);
}

/* ---------- CSV export ---------- */
function toCsvValue(v){ if(v===null||v===undefined) return ''; const s=String(v).replace(/"/g,'""'); return /[",\n]/.test(s) ? `"${s}"` : s; }
function downloadCsv(filename, rows){
  const csv = rows.map(r=>r.map(toCsvValue).join(',')).join('\n');
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ---------- Voice memo recording + live transcription ---------- */
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
function wireRecorder(btnId, textareaId, audioPreviewId, audioPlayerId, audioRemoveId, setBlob){
  const btn = document.getElementById(btnId);
  const textarea = document.getElementById(textareaId);
  const preview = document.getElementById(audioPreviewId);
  const player = document.getElementById(audioPlayerId);
  const removeBtn = document.getElementById(audioRemoveId);
  let mediaRecorder = null, chunks = [], recognizer = null, recording = false, startedAt = 0, timerInt = null;

  removeBtn.onclick = ()=>{ setBlob(null); preview.classList.remove('show'); player.src=''; };

  btn.onclick = async ()=>{
    if(recording){ stop(); return; }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      chunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };
      mediaRecorder.onstop = ()=>{
        stream.getTracks().forEach(tr=>tr.stop());
        const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });
        setBlob(blob);
        player.src = URL.createObjectURL(blob);
        preview.classList.add('show');
      };
      mediaRecorder.start();
      recording = true;
      startedAt = Date.now();
      btn.classList.add('recording');
      timerInt = setInterval(()=>{
        const secs = Math.floor((Date.now()-startedAt)/1000);
        btn.querySelector('span').textContent = `${t('stop')} (${secs}s)`;
      }, 500);

      if(SpeechRecognitionAPI){
        recognizer = new SpeechRecognitionAPI();
        recognizer.lang = LANG === 'he' ? 'he-IL' : 'en-US';
        recognizer.continuous = true;
        recognizer.interimResults = false;
        recognizer.onresult = (e)=>{
          let finalText = '';
          for(let i=e.resultIndex; i<e.results.length; i++){
            if(e.results[i].isFinal) finalText += e.results[i][0].transcript;
          }
          if(finalText.trim()){
            textarea.value = (textarea.value ? textarea.value + ' ' : '') + finalText.trim();
            textarea.dispatchEvent(new Event('input'));
          }
        };
        recognizer.onerror = ()=>{};
        try{ recognizer.start(); }catch(e){}
      }
    }catch(err){
      showToast(t('toastMicDenied'));
    }
  };

  function stop(){
    recording = false;
    clearInterval(timerInt);
    btn.classList.remove('recording');
    btn.querySelector('span').textContent = t('record');
    if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    if(recognizer){ try{ recognizer.stop(); }catch(e){} }
  }
}

  dayAudioBlob=null; document.getElementById('dayAudioPreview').classList.remove('show');
  document.getElementById('dayDraftNote').classList.remove('show'); localStorage.removeItem('draft_day');
  showToast(t('toastDaySaved')); loadDays(); loadFeed();
};

/* ---------- Notes ---------- */
async function loadNotes(){
  const { data } = await sb.from('notes').select('*, profiles(name, avatar_url)').order('created_at',{ascending:false});
  const list = document.getElementById('notesList');
  if(!data || !data.length){ list.innerHTML = `<div class="empty">${t('emptyNotes')}</div>`; return; }
  const { reactions, comments } = await loadReactionsAndComments(['note']);
  list.innerHTML = data.map(row=>cardHtml(row,'note', reactions, comments)).join('');
  wireCardActions(list);
}
document.getElementById('saveNoteBtn').onclick = async ()=>{
  const text = document.getElementById('noteText').value.trim();
  if(!text) return;
  let photo_path = null;
  if(notePhotoFile){ photo_path = await uploadPhoto(notePhotoFile, 'note'); if(photo_path===undefined) return; }
  let audio_path = null;
  if(noteAudioBlob){ audio_path = await uploadAudio(noteAudioBlob, 'note-audio'); if(audio_path===undefined) return; }
  const { error } = await sb.from('notes').insert({ user_id: currentUser.id, content: text, photo_path, audio_path });
  if(error){ showToast(t('toastSaveFailed')+error.message); return; }
  document.getElementById('noteText').value=''; document.getElementById('noteComposer').classList.remove('show');
  notePhotoFile=null; document.getElementById('notePhotoPreview').classList.remove('show'); document.getElementById('notePhotoInput').value='';
  noteAudioBlob=null; document.getElementById('noteAudioPreview').classList.remove('show');
  document.getElementById('noteDraftNote').classList.remove('show'); localStorage.removeItem('draft_note');
  showToast(t('toastNoteSaved')); loadNotes(); loadFeed();
};

/* ---------- Reactions & comments ---------- */
async function loadReactionsAndComments(types){
  const [{data:reactions},{data:comments}] = await Promise.all([
    sb.from('entry_reactions').select('*').in('entry_type', types),
    sb.from('entry_comments').select('*, profiles(name)').in('entry_type', types).order('created_at'),
  ]);
  return { reactions: groupBy(reactions, 'entry_id'), comments: groupBy(comments, 'entry_id') };
}

function cardHtml(row, type, reactionsByEntry, commentsByEntry){
  const p = row.profiles || {};
  const name = p.name || t('someone');
  const avatarHtml = p.avatar_url ? `<img src="${p.avatar_url}">` : initials(name);
  const badge = type==='day' ? `<span class="badge day">${t('badgeDay')}</span>` : `<span class="badge note">${t('badgeNote')}</span>`;
  const isOwner = currentUser && row.user_id === currentUser.id;
  const photoHtml = row.photo_path ? `<img class="card-photo" src="${photoUrl(row.photo_path)}" onclick="window.open(this.src,'_blank')">` : '';
  const audioHtml = row.audio_path ? `<audio controls src="${photoUrl(row.audio_path)}"></audio>` : '';

  const myReactions = (reactionsByEntry[row.id]||[]);
  const reactionBtns = REACTIONS.map(emoji=>{
    const count = myReactions.filter(r=>r.emoji===emoji).length;
    const active = currentUser && myReactions.some(r=>r.emoji===emoji && r.user_id===currentUser.id);
    return `<button class="reaction-btn ${active?'active':''}" data-react="${emoji}">${emoji}${count?' '+count:''}</button>`;
  }).join('');

  const myComments = (commentsByEntry[row.id]||[]);
  const commentsHtml = myComments.map(c=>`<div class="comment-row"><b>${escapeHtml((c.profiles&&c.profiles.name)||t('someone'))}:</b> ${escapeHtml(c.content)}</div>`).join('');
  const commentLabel = myComments.length===1 ? t('comment') : t('comments');
  const editDeleteBtns = isOwner ? `<button class="icon-btn" data-edit="1">${t('edit')}</button><button class="icon-btn" data-delete="1">🗑</button>` : '';

  return `<div class="card" data-id="${row.id}" data-type="${type}" data-photo="${row.photo_path||''}" data-audio="${row.audio_path||''}">
    ${photoHtml}
    ${audioHtml}
    <div class="meta">
      <div class="mini-avatar">${avatarHtml}</div>
      <span class="name">${escapeHtml(name)}</span>
      <span class="dot">·</span>
      <span class="time">${relTime(row.created_at)}</span>
      ${badge}
    </div>
    <div class="content" data-raw="${escapeHtml(row.content)}">${escapeHtml(row.content)}</div>
    <div class="card-actions">
      ${reactionBtns}
      <div class="spacer"></div>
      <button class="comment-toggle" data-toggle-comments="1">💬 ${myComments.length||''} ${commentLabel}</button>
      ${editDeleteBtns}
    </div>
    <div class="comments-box">
      ${commentsHtml}
      <div class="comment-input-row">
        <input type="text" placeholder="${t('writeComment')}">
        <button data-send-comment="1">${t('send')}</button>
      </div>
    </div>
  </div>`;
}

function wireCardActions(container){
  container.querySelectorAll('.card').forEach(card=>{
    const id = card.dataset.id, type = card.dataset.type;
    const table = type==='day' ? 'day_summaries' : 'notes';
    const reload = type==='day' ? loadDays : loadNotes;

    card.querySelectorAll('.reaction-btn').forEach(btn=>{
      btn.onclick = async ()=>{
        const emoji = btn.dataset.react;
        const active = btn.classList.contains('active');
        if(active){
          await sb.from('entry_reactions').delete().eq('entry_type', type).eq('entry_id', id).eq('user_id', currentUser.id).eq('emoji', emoji);
        } else {
          await sb.from('entry_reactions').insert({ entry_type:type, entry_id:id, user_id:currentUser.id, emoji });
        }
        reload(); loadFeed();
      };
    });

    const commentsBox = card.querySelector('.comments-box');
    const toggleBtn = card.querySelector('[data-toggle-comments]');
    if(toggleBtn) toggleBtn.onclick = ()=> commentsBox.classList.toggle('show');
    const sendBtn = card.querySelector('[data-send-comment]');
    if(sendBtn) sendBtn.onclick = async ()=>{
      const input = card.querySelector('.comment-input-row input');
      const text = input.value.trim();
      if(!text) return;
      await sb.from('entry_comments').insert({ entry_type:type, entry_id:id, user_id:currentUser.id, content:text });
      input.value='';
      reload(); loadFeed();
    };

    const editBtn = card.querySelector('[data-edit]');
    if(editBtn) editBtn.onclick = ()=>{
      const contentEl = card.querySelector('.content');
      const raw = contentEl.dataset.raw;
      contentEl.innerHTML = `<textarea>${raw}</textarea><div class="edit-row"><button class="btn ghost" data-cancel-edit="1">${t('cancel')}</button><button class="btn primary" data-save-edit="1">${t('save')}</button></div>`;
      card.querySelector('[data-cancel-edit]').onclick = ()=> reload();
      card.querySelector('[data-save-edit]').onclick = async ()=>{
        const newText = card.querySelector('.content textarea').value.trim();
        if(!newText) return;
        await sb.from(table).update({ content:newText }).eq('id', id);
        showToast(t('toastUpdated')); reload(); loadFeed();
      };
    };

    const deleteBtn = card.querySelector('[data-delete]');
    if(deleteBtn) deleteBtn.onclick = async ()=>{
      if(!confirm(t('confirmDeleteEntry'))) return;
      const photoPath = card.dataset.photo, audioPath = card.dataset.audio;
      await sb.from(table).delete().eq('id', id);
      if(photoPath) await deletePhoto(photoPath);
      if(audioPath) await deletePhoto(audioPath);
      showToast(t('toastDeleted')); reload(); loadFeed();
    };
  });
}

/* ---------- Feed (days + notes combined) ---------- */
async function loadFeed(){
  const [{data:days}, {data:notes}] = await Promise.all([
    sb.from('day_summaries').select('*, profiles(name, avatar_url)').order('created_at',{ascending:false}).limit(30),
    sb.from('notes').select('*, profiles(name, avatar_url)').order('created_at',{ascending:false}).limit(30),
  ]);
  const combined = [
    ...(days||[]).map(r=>({...r, _type:'day'})),
    ...(notes||[]).map(r=>({...r, _type:'note'})),
  ].sort((a,b)=> new Date(b.created_at) - new Date(a.created_at));
  const list = document.getElementById('feedList');
  document.getElementById('dayCount').textContent = combined.length ? `${combined.length} ${combined.length===1?t('update'):t('updates')}` : '';
  if(!combined.length){ list.innerHTML = `<div class="empty">${t('emptyFeed')}</div>`; return; }
  const { reactions, comments } = await loadReactionsAndComments(['day','note']);
  list.innerHTML = combined.map(row=>cardHtml(row,row._type, reactions, comments)).join('');
  wireCardActions(list);
}

/* ---------- Chairs ---------- */
async function loadChairs(){
  const { data: chairs } = await sb.from('chairs').select('*').order('created_at',{ascending:false});
  const list = document.getElementById('chairsList');
  if(!chairs || !chairs.length){ list.innerHTML = `<div class="empty">${t('emptyChairs')}</div>`; return; }

  const rows = await Promise.all(chairs.map(async chair=>{
    const { data: items } = await sb.from('chair_items').select('status').eq('chair_id', chair.id);
    const problems = (items||[]).filter(i=>i.status==='problem').length;
    const pending = (items||[]).filter(i=>i.status==='unchecked').length;
    let pill;
    if(problems>0) pill = `<span class="status-pill warn">${problems} ${problems===1?t('issue'):t('issues')}</span>`;
    else if(pending>0) pill = `<span class="status-pill pending">${pending} ${t('toCheck')}</span>`;
    else pill = `<span class="status-pill ok">${t('allGood')}</span>`;
    const itemCount = (items||[]).length;
    return `<div class="chair-row" data-id="${chair.id}">
      <div><h3>${escapeHtml(chair.name)}</h3><div class="sub">${itemCount} ${itemCount===1?t('checklistItems'):t('checklistItemsPl')}</div></div>
      ${pill}
    </div>`;
  }));
  list.innerHTML = rows.join('');
  document.querySelectorAll('.chair-row').forEach(el=> el.onclick = ()=> openChair(el.dataset.id));
}

document.getElementById('newChairBtn').onclick = async ()=>{
  const name = prompt(t('promptChairName'));
  if(!name || !name.trim()) return;
  const { data, error } = await sb.from('chairs').insert({ name: name.trim(), created_by: currentUser.id }).select().single();
  if(error){ showToast(t('toastChairFailed')+error.message); return; }
  const labels = DEFAULT_ITEMS[LANG] || DEFAULT_ITEMS.en;
  const items = labels.map((label,i)=>({ chair_id:data.id, label, sort_order:i }));
  await sb.from('chair_items').insert(items);
  loadChairs();
  openChair(data.id);
};

async function openChair(id){
  currentChairId = id;
  switchView('chairDetailView');
  const { data: chair } = await sb.from('chairs').select('*').eq('id', id).single();
  document.getElementById('chairNameInput').value = chair.name;
  const preview = document.getElementById('chairPhotoPreview'), img = document.getElementById('chairPhotoImg');
  if(chair.photo_path){ img.src = photoUrl(chair.photo_path); preview.classList.add('show'); }
  else { preview.classList.remove('show'); img.src=''; }
  await loadChairItems();
}
document.getElementById('backToChairs').onclick = ()=>{ currentChairId=null; switchView('chairsView'); loadChairs(); };

document.getElementById('deleteChairBtn').onclick = async ()=>{
  if(!confirm(t('confirmDeleteChair'))) return;
  const { data: chair } = await sb.from('chairs').select('photo_path').eq('id', currentChairId).single();
  const { data: items } = await sb.from('chair_items').select('photo_path').eq('chair_id', currentChairId);
  await sb.from('chairs').delete().eq('id', currentChairId);
  if(chair && chair.photo_path) await deletePhoto(chair.photo_path);
  (items||[]).forEach(i=>{ if(i.photo_path) deletePhoto(i.photo_path); });
  showToast(t('toastDeleted'));
  currentChairId = null; switchView('chairsView'); loadChairs();
};

let chairNameTimer;
document.getElementById('chairNameInput').addEventListener('input', (e)=>{
  clearTimeout(chairNameTimer);
  chairNameTimer = setTimeout(async ()=>{
    await sb.from('chairs').update({ name: e.target.value.trim() }).eq('id', currentChairId);
    showToast(t('toastSaved'));
  }, 500);
});

document.getElementById('chairPhotoBtn').onclick = ()=> document.getElementById('chairPhotoInput').click();
document.getElementById('chairPhotoInput').onchange = async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const path = await uploadPhoto(file, 'chair');
  if(!path) return;
  const { data: old } = await sb.from('chairs').select('photo_path').eq('id', currentChairId).single();
  await sb.from('chairs').update({ photo_path: path }).eq('id', currentChairId);
  if(old && old.photo_path) deletePhoto(old.photo_path);
  document.getElementById('chairPhotoImg').src = photoUrl(path);
  document.getElementById('chairPhotoPreview').classList.add('show');
  showToast(t('toastPhotoAdded'));
};
document.getElementById('chairPhotoRemove').onclick = async ()=>{
  const { data: old } = await sb.from('chairs').select('photo_path').eq('id', currentChairId).single();
  await sb.from('chairs').update({ photo_path: null }).eq('id', currentChairId);
  if(old && old.photo_path) deletePhoto(old.photo_path);
  document.getElementById('chairPhotoPreview').classList.remove('show');
  document.getElementById('chairPhotoInput').value='';
};

async function loadChairItems(){
  const { data: items } = await sb.from('chair_items').select('*').eq('chair_id', currentChairId).order('sort_order');
  const list = document.getElementById('chairItemsList');
  if(!items || !items.length){ list.innerHTML = `<div class="empty">${t('noChecklist')}</div>`; return; }
  list.innerHTML = items.map(item=>`
    <div class="checklist-item" data-id="${item.id}" data-photo="${item.photo_path||''}">
      <div class="label-row"><span class="label">${escapeHtml(item.label)}</span></div>
      <div class="status-toggle">
        <button class="good ${item.status==='good'?'active':''}" data-status="good">${t('good')}</button>
        <button class="problem ${item.status==='problem'?'active':''}" data-status="problem">${t('problem')}</button>
      </div>
      <textarea class="problem-note ${item.status==='problem'?'show':''}" placeholder="${t('problemPlaceholder')}">${escapeHtml(item.note||'')}</textarea>
      <div class="item-photo-row">
        <button class="item-photo-btn" data-photo-btn="1">📷 ${item.photo_path?t('changePhoto'):t('addPhoto')}</button>
        <input type="file" accept="image/*" style="display:none">
        ${item.photo_path ? `<img class="item-photo-thumb" src="${photoUrl(item.photo_path)}" onclick="window.open(this.src,'_blank')">` : ''}
      </div>
    </div>
  `).join('');

  list.querySelectorAll('.checklist-item').forEach(el=>{
    const itemId = el.dataset.id;
    const noteEl = el.querySelector('.problem-note');
    el.querySelectorAll('.status-toggle button').forEach(btn=>{
      btn.onclick = async ()=>{
        const status = btn.dataset.status;
        el.querySelectorAll('.status-toggle button').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        noteEl.classList.toggle('show', status==='problem');
        await sb.from('chair_items').update({ status, updated_by: currentUser.id, updated_at: new Date().toISOString() }).eq('id', itemId);
      };
    });
    let noteTimer;
    noteEl.addEventListener('input', ()=>{
      clearTimeout(noteTimer);
      noteTimer = setTimeout(async ()=>{
        await sb.from('chair_items').update({ note: noteEl.value, updated_by: currentUser.id, updated_at: new Date().toISOString() }).eq('id', itemId);
        showToast(t('toastSaved'));
      }, 600);
    });
    const photoBtn = el.querySelector('[data-photo-btn]');
    const photoInput = el.querySelector('input[type=file]');
    photoBtn.onclick = ()=> photoInput.click();
    photoInput.onchange = async ()=>{
      const file = photoInput.files[0];
      if(!file) return;
      const path = await uploadPhoto(file, 'chair-item');
      if(!path) return;
      const oldPath = el.dataset.photo;
      await sb.from('chair_items').update({ photo_path: path }).eq('id', itemId);
      if(oldPath) deletePhoto(oldPath);
      showToast(t('toastPhotoAdded'));
      loadChairItems();
    };
  });
}

document.getElementById('addChecklistItemBtn').onclick = async ()=>{
  const label = prompt(t('promptItemName'));
  if(!label || !label.trim()) return;
  const { data: existing } = await sb.from('chair_items').select('sort_order').eq('chair_id', currentChairId).order('sort_order',{ascending:false}).limit(1);
  const nextOrder = existing && existing.length ? existing[0].sort_order+1 : 0;
  await sb.from('chair_items').insert({ chair_id: currentChairId, label: label.trim(), sort_order: nextOrder });
  loadChairItems();
};

/* ---------- Realtime: keep everyone's screen fresh ---------- */
function subscribeRealtime(){
  sb.channel('trip-updates')
    .on('postgres_changes', { event:'*', schema:'public', table:'day_summaries' }, ()=>{ loadDays(); loadFeed(); })
    .on('postgres_changes', { event:'*', schema:'public', table:'notes' }, ()=>{ loadNotes(); loadFeed(); })
    .on('postgres_changes', { event:'*', schema:'public', table:'chairs' }, ()=>{ loadChairs(); })
    .on('postgres_changes', { event:'*', schema:'public', table:'chair_items' }, ()=>{
      loadChairs();
      if(currentChairId) loadChairItems();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'entry_reactions' }, ()=>{ loadDays(); loadNotes(); loadFeed(); })
    .on('postgres_changes', { event:'*', schema:'public', table:'entry_comments' }, ()=>{ loadDays(); loadNotes(); loadFeed(); })
    .subscribe();
}

/* ---------- Restore session on load ---------- */
(async ()=>{
  const { data:{ session } } = await sb.auth.getSession();
  if(session && session.user) boot(session.user);
})();
</script>
